<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Asistencia | Claro</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="logo-wrap">
      <img src="assets/logo-claro.png" alt="Claro" class="logo-img" onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';">
      <div class="logo-fallback" style="display:none;">
        <span class="logo-dot"></span>
        <span class="logo-text">claro</span>
      </div>
    </div>
    <h1 class="topbar-title">Registro de Asistencia</h1>
    <button type="button" id="btn-ver-registrados" class="btn-topbar">
      Ver registrados
    </button>
  </header>

  <!-- Panel: empleados ya registrados hoy -->
  <div class="overlay" id="overlay-registrados" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="titulo-registrados">
      <div class="panel-header">
        <h2 id="titulo-registrados">Registrados hoy</h2>
        <button type="button" id="btn-cerrar-registrados" class="btn-cerrar" aria-label="Cerrar">&times;</button>
      </div>

      <div class="panel-toolbar">
        <input
          type="text"
          id="input-buscar-registrados"
          placeholder="Buscar por nombre, código o mesa..."
          autocomplete="off"
        >
        <button type="button" id="btn-actualizar-registrados" class="btn-secondary btn-actualizar">
          Actualizar
        </button>
      </div>

      <p class="panel-contador" id="contador-registrados">&nbsp;</p>

      <div class="panel-lista" id="lista-registrados">
        <p class="panel-estado" id="estado-registrados">Cargando...</p>
        <table class="tabla-registrados" id="tabla-registrados" hidden>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Código</th>
              <th>Mesa</th>
              <th>Hora</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla-registrados"></tbody>
        </table>
      </div>
    </div>
  </div>

  <main class="container">
    <section class="card">

      <form id="form-asistencia" autocomplete="off">

        <div class="field">
          <label for="input-codigo">Código de empleado</label>
          <input
            type="text"
            id="input-codigo"
            name="codigo"
            placeholder="Ej. 10245"
            inputmode="numeric"
            autofocus
          >
          <span class="hint" id="hint-codigo">&nbsp;</span>
        </div>

        <button type="button" id="btn-validar" class="btn-secondary">
          Validar
        </button>

        <div class="field">
          <label for="input-nombre">Nombre del empleado</label>
          <input
            type="text"
            id="input-nombre"
            name="nombre"
            placeholder="Se completa automáticamente"
            readonly
          >
        </div>

        <div class="mesa-box" id="mesa-box" hidden>
          <span class="mesa-label">Mesa asignada</span>
          <span class="mesa-valor" id="mesa-valor">—</span>
        </div>

        <button type="submit" id="btn-registrar" class="btn-primary" disabled>
          Registrar asistencia
        </button>

        <div class="mensaje" id="mensaje" role="status" aria-live="polite"></div>

      </form>

    </section>

    <p class="footer-note">Sistema interno de control de asistencia · Claro</p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
